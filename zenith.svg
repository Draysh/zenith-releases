  <rect x="60" y="50" width="136" height="36" fill="#02161A"/>
  <rect x="60" y="170" width="136" height="36" fill="#02161A"/>
  <polygon points="150,86 196,86 106,170 60,170" fill="#02161A"/>
  <circle cx="208" cy="48" r="20" fill="#FF3DA5" stroke="#3DE0F5" stroke-width="8"/>
</svg>
